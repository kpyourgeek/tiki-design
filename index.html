<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiki — App Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0F13;--card:#17181E;--line:#2C2D36;--text:#F5F2EA;--muted:#A3A09A;--saffron:#FFB547}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:24px 16px 32px;background:#111217}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 4px}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand span{color:var(--saffron);font-weight:800}
.sub{color:var(--muted);font-size:13px;font-weight:600;padding:0 8px 16px;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 16px}
.tabs button{height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:800;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--saffron);color:#1A1203}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 8px 8px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px;font-size:14px;font-weight:700;color:var(--text);line-height:1.35}
.item:hover{background:#1C1D24}
.item[aria-current=true]{background:#2A2113;color:var(--saffron)}
main{position:relative;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:13px}
.bar button:disabled{opacity:.4;cursor:default}
.stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.phone{flex-shrink:0;border-radius:52px;padding:10px;background:#000;box-shadow:0 0 0 1px #2C2D36,0 30px 80px rgba(0,0,0,.6);transform-origin:top center}
.phone iframe{display:block;border:0;border-radius:42px;background:var(--ink)}
.comp{flex-shrink:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;transform-origin:top center}
.comp iframe{display:block;border:0;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px;width:100%;align-content:start}
.tile{background:none;border:0;padding:0;text-align:left}
.tile .frame{width:172px;height:372px;border-radius:24px;overflow:hidden;background:#000;padding:4px;box-shadow:0 0 0 1px #2C2D36}
.tile .frame iframe{width:390px;height:844px;border:0;transform:scale(.4205);transform-origin:0 0;pointer-events:none;border-radius:44px}
.tile .cap{font-size:13px;font-weight:700;margin-top:8px;color:var(--muted);line-height:1.35;max-width:180px}
.tile:hover .cap{color:var(--saffron)}
.notes{max-width:760px;display:grid;gap:16px}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;white-space:pre-wrap;font-size:14px;line-height:1.6;color:#D9D5CC}
.note::first-line{font-weight:800;color:var(--text);font-size:16px}
.hint{color:var(--muted);font-size:13px;font-weight:600;margin-left:auto}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}.bar{padding:12px 16px}.stage{padding:16px}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>tiki<span>.</span></b></div>
    <div class="sub">App design · 17 screens, 14 shared components. Every screen is live: tap through it like the real app.</div>
    <div class="tabs" role="group" aria-label="View">
      <button id="vPhone" aria-pressed="true">Prototype</button>
      <button id="vGrid" aria-pressed="false">All screens</button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="bar">
      <button id="back" disabled aria-label="Back">← Back</button>
      <h1 id="title">Tiki</h1>
      <button id="restart">Restart screen</button>
      <span class="hint">Links inside the app work · scroll inside the phone</span>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>
<script>

enum\",\"options\":[\"discover\",\"tickets\",\"saved\",\"profile\"],\"default\":\"discover\"},\"savedCount\":{\"editor\":\"int\",\"default\":2,\"min\":0,\"max\":99},\"lang\":{\"editor\":\"enum\",\"options\":[\"en\",\"ar\"],\"default\":\"en\"},\"$preview\":{\"width\":390,\"height\":86}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const active = this.props.active || 'discover';\n    const saved = this.props.savedCount ?? 2;\n    const ar = this.props.lang === 'ar';\n    const L = ar ? { discover: 'اكتشف', tickets: 'تذاكري', saved: 'المحفوظة', profile: 'حسابي' } : null;\n    const defs = [\n      { id: 'discover', label: 'Discover', href: 'Main.dc.html', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z' },\n      { id: 'tickets', label: 'Tickets', href: 'MyTickets.dc.html', icon: 'M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4zM14 7v2M14 11v2M14 15v2' },\n      { id: 'saved', label: 'Saved', href: 'Saved.dc.html', icon: 'M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z', badge: saved > 0 ? String(saved) : '' },\n      { id: 'profile', label: 'Profile', href: 'Profile.dc.html', icon: 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21a8 8 0 0 1 16 0' }\n    ];\n    const tabs = defs.map((d) => {\n      const on = d.id === active;\n      return {\n        ...d,\n        label: L ? L[d.id] : d.label,\n        badge: d.badge || '',\n        current: on ? 'page' : 'false',\n        fill: on && d.id === 'saved' ? 'currentColor' : 'none',\n        style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 13px; font-family: ' + (ar ? \"'IBM Plex Sans Arabic', sans-serif\" : 'Manrope, sans-serif') + '; min-height: 44px; ' + (on ? 'color: #FFB547; font-weight: 800' : 'color: #A3A09A; font-weight: 700')\n      };\n    });\n    return { tabs, dir: ar ? 'rtl' : 'ltr' };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"  },\n      comedy: { name: 'Comedy night Oran', bg: '#FF7A59' },\n      gnawa: { name: 'Gnawa night', bg: '#6EC1FF' }\n    };\n    const e = evs[s.current] || evs.rai;\n    let status, tone;\n    if (s.current === 'rai') { status = s.cancelled ? 'Cancelled · refunds sent' : s.paused ? 'Sales paused' : 'On sale · 8 days to go'; tone = s.cancelled ? '#FF8A8A' : s.paused ? '#FFB547' : '#3BD68E'; }\n    else if (s.current === 'comedy') { status = 'Draft · not published'; tone = '#A3A09A'; }\n    else { status = 'Ended 12 Sep'; tone = '#A3A09A'; }\n    const av = (bg, fg) => 'width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; background: ' + bg + '; color: ' + fg;\n    const orders = [\n      { name: 'Lina Bouzid', initials: 'LB', meta: '2 × VIP · 4 min ago', amount: '9 000 DA', avatarStyle: av('#FFB547', '#1A1203') },\n      { name: 'Mehdi Ait Ali', initials: 'MA', meta: '4 × General · 18 min ago', amount: '6 000 DA', avatarStyle: av('#6EC1FF', '#04223A') },\n      { name: 'Yasmine Belkacem', initials: 'YB', meta: '3 × General · 1 h ago', amount: '4 500 DA', avatarStyle: av('#6EC1FF', '#04223A') }\n    ];\n    const ready = forced === 'live';\n    return {\n      isLoading: forced === 'loading',\n      isNew: forced === 'new host',\n      hasEvents: ready,\n      current: s.current, paused: s.paused, cancelled: s.cancelled,\n      evName: e.name, evStatus: status,\n      thumbStyle: 'width: 42px; height: 44px; border-radius: 12px; flex-shrink: 0; background: ' + e.bg,\n      evStatusStyle: 'display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: ' + tone,\n      dotStyle: 'width: 7px; height: 7px; border-radius: 50%; background: ' + tone,\n      isLive: s.current === 'rai' && !s.cancelled,\n      showPaused: s.current === 'rai' && s.paused && !s.cancelled,\n      showCancelled: s.current === 'rai' && s.cancelled,\n      isDraft: s.current === 'comedy',\n      isPast: s.current === 'gnawa',\n      orders,\n      shareLabel: s.shared ? 'Link copied' : 'Share link',\n      share: () => { this.setState({ shared: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ shared: false }), 2200); },\n      resume: () => this.setState({ paused: false }),\n      showEvents: s.sheet === 'events',\n      showGuests: s.sheet === 'guests',\n      openEvents: () => this.setState({ sheet: 'events' }),\n      openGuests: () => this.setState({ sheet: 'guests' }),\n      closeSheets: () => this.setState({ sheet: null }),\n      switchEvent: (id) => this.setState({ current: id, sheet: null }),\n      setPaused: (v) => this.setState({ paused: v }),\n      cancelEvent: () => this.setState({ cancelled: true, paused: false, sheet: null })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "EventDetail": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · Event detail\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;background:#0E0F13}\n*{box-sizing:border-box}\na{color:#FFB547;text-decoration:none}a:hover{color:#FFCB7A}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed}\n@keyframes tikitoast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: 844px; background: #0E0F13; color: #F5F2EA; font-family: Manrope, sans-serif; position: relative; overflow: hidden\">\n\n  \u003cdiv style=\"height: 216px; background: #FFB547; position: relative; overflow: hidden ];\n      return {\n        ...c,\n        pressed: on ? 'true' : 'false',\n        iconColor: on ? '#FFB547' : '#A3A09A',\n        toggle: () => this.setState({ cats: { ...s.cats, [c.id]: !on } }),\n        style: 'height: 68px; border-radius: 16px; cursor: pointer; font: 700 13px Manrope, sans-serif; color: #F5F2EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ' + (on ? 'background: #2A2113; border: 2px solid #FFB547; font-weight: 800' : 'background: #0E0F13; border: 1px solid #2C2D36')\n      };\n    });\n    const nCats = catDefs.filter((c) => s.cats[c.id]).length;\n    const count = Math.max(0, Math.round((s.when === 'any' ? 60 : s.when === 'weekend' ? 38 : 12) * (nCats ? nCats / 3 : 1) * (s.price / 10000 + 0.3) * (s.family ? 0.5 : 1)));\n    const fam = s.family;\n    return {\n      wilaya: p.wilaya || 'Alger',\n      whens, cats,\n      price: s.price,\n      priceLabel: s.price === 0 ? 'Free only' : s.price >= 10000 ? 'Any price' : 'Up to ' + String(s.price).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ') + ' DA',\n      onPrice: (e) => this.setState({ price: parseInt(e.target.value, 10) || 0 }),\n      familyChecked: fam ? 'true' : 'false',\n      toggleFamily: () => this.setState({ family: !fam }),\n      trackStyle: 'width: 52px; height: 32px; border-radius: 999px; border: 0; position: relative; flex-shrink: 0; cursor: pointer; transition: background 0.2s; background: ' + (fam ? '#3BD68E' : '#3A3B45'),\n      knobStyle: 'position: absolute; top: 4px; width: 24px; height: 24px; border-radius: 50%; transition: left 0.2s; left: ' + (fam ? '24px' : '4px') + '; background: ' + (fam ? '#0E0F13' : '#A3A09A'),\n      applyLabel: count === 0 ? 'No events match · loosen a filter' : 'Show ' + count + ' events',\n      applyStyle: 'width: 100%; height: 56px; border-radius: 18px; border: 0; font: 800 16px Manrope, sans-serif; cursor: pointer; ' + (count === 0 ? 'background: #22232B; color: #A3A09A' : 'background: #FFB547; co  font-size: 14px; color: #CFF5E2\">One entry per ticket, across all gates\u003c/div>\u003cdiv style=\"font-size: 13px; color: #9FD9BC; font-weight: 600; margin-top: 4px\">The first scan locks the ticket and saves the gate, the time and who scanned it.\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003csc-if value=\"{{toast}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv role=\"status\" style=\"border-radius: 12px; background: #10301F; color: #3BD68E; font-size: 13px; font-weight: 800; padding: 12px 12px\">{{toast}}\u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{hasPending}}\" hint-placeholder-val=\"{{true}}\">\n        \u003cbutton onClick=\"{{openPendingGate}}\" style=\"display: flex; gap: 12px; align-items: center; background: #2A2113; border: 1px solid #5A4520; border-radius: 16px; padding: 12px 16px; color: #FFCB7A; text-align: left; font-family: inherit; min-height: 56px\">\n          \u003cspan style=\"width: 10px; height: 10px; border-radius: 50%; background: #FFB547; flex-shrink: 0\">\u003c/span>\n          \u003cspan style=\"flex: 1; font-weight: 800; font-size: 14px\">{{pendingBanner}}\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 800\">Review\u003c/span>\n        \u003c/button>\n      \u003c/sc-if>\n\n      \u003csc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"3\">\n        \u003cdiv style=\"{{g.cardStyle}}\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px\">\n            \u003cbutton aria-expanded=\"{{g.expanded}}\" aria-label=\"{{g.expandLabel}}\" onClick=\"{{g.toggleExp}}\" style=\"flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; color: #F5F2EA; text-align: left; font-family: inherit; min-height: 48px\">\n              \u003cspan style=\"{{g.badgeStyle}}\">{{g.letter}}\u003c/span>\n              \u003cspan style=\"flex: 1; min-width: 0; line-height: 1.35\">\n n-items: center; justify-content: center; flex-shrink: 0\">{{r.initials}}\u003c/span>\n                  \u003cspan style=\"flex: 1; min-width: 0; line-height: 1.35\">\u003cspan style=\"display: block; font-weight: 800; font-size: 14px\">{{r.name}} wants to scan here\u003c/span>\u003cspan style=\"display: block; font-size: 13px; color: #D9C29A; font-weight: 600\">{{r.meta}}\u003c/span>\u003c/span>\n                \u003c/div>\n                \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n                  \u003cbutton onClick=\"{{r.decline}}\" style=\"height: 44px; border-radius: 12px; background: #0E0F13; border: 0; color: #F5F2EA; font-weight: 800; font-size: 14px\">Decline\u003c/button>\n                  \u003cbutton onClick=\"{{r.approve}}\" style=\"height: 44px; border-radius: 12px; background: #FFB547; border: 0; color: #1A1203; font-weight: 800; font-size: 14px\">Approve\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/sc-for>\n\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\n              \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                \u003cspan style=\"font-size: 13px; color: #A3A09A; font-weight: 800; letter-spacing: 0.06em\">GATE {{g.letter}} PIN\u003c/span>\n                \u003cspan style=\"font-size: 13px; color: #6B6862; font-weight: 700\">You approve each new helper\u003c/span>\n              \u003c/div>\n              \u003cdiv style=\"height: 52px; border-radius: 12px; background: #0E0F13; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.2em\">{{g.pinShown}}\u003c/div>\n              \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n                \u003ca href=\"{{g.shareHref}}\" target=\"_blank\" rel=\"noopener\" style=\"height: 44px; border-radius: 12px; background: #22232B; color: #F5F2EA; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center\">Send on WhatsApp\u003c/a>\n                \u003cbutton onClick=\"{{g.newPin}}\" style=\"height: 44px; border-radius: 12px; background: #22232B; border: 0; color: #F5F2EA; font-weight: 800; font-size: 13px\">New PIN\u003c/button>\n              \u003c/div>\n            \u003c/div>\n\n            \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px\">\n              \u003cspan style=\"font-size: 13px; color: #A3A09A; font-weight: 800; letter-spacing: 0.06em\">HELPERS · {{g.helperCount}}\u003c/span>\n              \u003csc-if value=\"{{g.noHelpers}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv style=\"font-size: 13px; color: #A3A09A; font-weight: 600; padding: 4px 0\">Nobody yet. Send the event code and this PIN to someone you trust.\u003c/div>\n              \u003c/sc-if>\n              \u003csc-for list=\"{{g.helpers}}\" as=\"h\" hint-placeholder-count=\"2\">\n                \u003cdiv style=\"display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid #22232B\">\n                  \u003cspan style=\"{{h.avatarStyle}}\">{{h.initials}}\u003c/span>\n                  \u003cspan style=\"flex: 1; min-width: 0; line-height: 1.35\">\u003cspan style=\"display: block; font-weight: 800; font-size: 14px\">{{h.name}}\u003c/span>\u003cspan style=\"{{h.metaStyle}}\">{{h.meta}}\u003c/span>\u003c/span>\n                  \u003cbutton aria-label=\"{{h.removeLabel}}\" onClick=\"{{h.remove}}\" style=\"width: 44px; height: 44px; border-radius: 12px; background: #22232B; border: 0; color: #FF8A8A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">\n                    \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M6 6l12 12M18 6 6 18\">\u003c/path>\u003c/svg>\n                  \u003c/button>\n                \u003c/div>\n              \u003c/sc-for>\n            \u003c/div>\n\n            \u003csc-if value=\"{{g.canScan}}\" hint-placeholder-val=\"{{true}}\">\n              \u003ca href=\"Scanner.dc.html\" style=\"height: 44px; border-radius: 12px; border: 1px solid #2C2D36; color: #F5F2EA; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px\">\n                \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFB547\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16\">\u003c/path>\u003c/svg>Scan here myself\u003c/a>\n            \u003c/sc-if>\n          \u003c/div>\n          \u003c/sc-if>\n        \u003c/div>\n      \u003c/sc-for>\n\n      \u003csc-if value=\"{{adding}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"background: #17181E; border: 2px solid #FFB547; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n          \u003cspan style=\"font-weight: 800; font-size: 14px\">New gate {{nextLetter}}\u003c/span>\n          \u003cinput aria-label=\"Gate name\" value=\"{{newName}}\" onChange=\"{{onNewName}}\" placeholder=\"e.g. Press entrance\" style=\"height: 48px; border-radius: 12px; background: #0E0F13; border: 1px solid #3A3B45; padding: 0 12px; color: #F5F2EA; font: 700 16px Manrope, sans-serif; outline: none\">\n          \u003cspan style=\"font-size: 13px; color: #A3A09A; font-weight: 600\">A PIN is created for it right away.\u003c/span>\n          \u003cbutton onClick=\"{{confirmAdd}}\" style=\"{{addBtnStyle}}\">Add gate {{nextLetter}}\u003c/button>\n          \u003cbutton onClick=\"{{cancelAdd}}\" style=\"height: 40px; border-radius: 12px; background: none; border: 0; color: #A3A09A; font-weight: 800; font-size: 13px\">Cancel\u003c/button>\n        \u003c/div>\n      \u003c/sc-if>\n      \u003csc-if value=\"{{canAdd}}\" hint-placeholder-val=\"{{true}}\">\n        \u003cbutton onClick=\"{{startAdd}}\" style=\"height: 48px; border-radius: 16px; border: 1.5px dashed #4A4B55; background: none; color: #FFB547; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\">\u003c/path>\u003c/svg>Add a gate\u003c/button>\n      \u003c/sc-if>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"position: absolute; left: 0; right: 0; bottom: 0\">\n    \u003cdc-import name=\"HostNav\" active=\"gates\" hint-size=\"390px,86px\">\u003c/dc-import>\n  \u003c/div>\n\n  \u003csc-if value=\"{{confirmingRemove}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cdiv style=\"position: absolute; inset: 0; z-index: 5\">\n      \u003cdc-import name=\"ConfirmDialog\" title=\"{{removeTitle}}\" body=\"Their scanner stops working right away. Scans they already made stay in your records.\" confirm-label=\"Remove helper\" cancel-label=\"Keep\" tone=\"danger\" on-confirm=\"{{doRemove}}\" on-cancel=\"{{cancelRemove}}\" hint-size=\"390px,844px\">\u003c/dc-import>\n    \u003c/div>\n  \u003c/sc-if>\n  \u003csc-if value=\"{{confirmingPin}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cdiv style=\"position: absolute; inset: 0; z-index: 5\">\n      \u003cdc-import name=\"ConfirmDialog\" title=\"{{pinTitle}}\" body=\"Helpers already on this gate keep working. The old PIN stops working for anyone new.\" confirm-label=\"Make a new PIN\" cancel-label=\"Keep current PIN\" tone=\"default\" on-confirm=\"{{doNewPin}}\" on-cancel=\"{{cancelPin}}\" hint-size=\"390px,844px\">\u003c/dc-import>\n    \u00  filter: id }),\n        style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; display: flex; align-items: center; gap: 8px; ' + (on ? 'border: 0; background: #F5F2EA; color: #0E0F13; font-weight: 800' : 'border: 1px solid #2C2D36; background: #17181E; color: #F5F2EA; font-weight: 700'),\n        countStyle: id === 'all' ? 'display: none' : 'min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; ' + (on ? 'background: #0E0F13; color: #F5F2EA' : 'background: #2C2D36; color: #D9D5CC')\n      };\n    });\n    const shown = all.filter((n) => match(n, s.filter)).map((n) => {\n      const [fg, bg] = tint[n.type];\n      return {\n        ...n,\n        icon: n.clock ? icons.clock : icons[n.type],\n        color: fg,\n        read: () => this.setState({ read: { ...s.read, [n.id]: true } }),\n        iconStyle: 'width: 42px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + bg,\n        cardStyle: 'display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 18px; color: #F5F2EA; ' + (n.unread ? 'background: #1B1C23; border: 1px solid #3A3B45' : 'background: #131419; border: 1px solid #22232B')\n      };\n    });\n    const groups = [['today', 'TODAY'], ['week', 'EARLIER THIS WEEK']].map(([d, label]) => ({ label, items: shown.filter((n) => n.day === d) })).filter((g) => g.items.length);\n    const unread = all.filter((n) => n.unread).length;\n    const loading = forced === 'loading' || s.retrying;\n    const error = forced === 'error' && !s.retrying && !s.recovered;\n    const empty = !loading && !error && shown.length === 0;\n    const emptyText = {\n      unread: ['You are all caught up', 'No unread notifications. We will tap you when something changes.'],\n      tickets: ['No ticket updates', 'Transfers, reminders and gate info will show up here.'],\n      balance: ['No balance activity', 'Top-ups, payments and refunds will show up here.'],\n      events: ['No event alerts', 'Save an event to hear when tickets run low.'],\n      all: ['No notifications yet', 'We will let you know about your tickets and balance.']\n    }[s.filter];\n    return {\n      filters, groups,\n      unreadLabel: unread ? unread + ' unread' : 'All caught up',\n      canMarkAll: unread > 0 && !loading && !error,\n      markAll: () => { const r = {}; all.forEach((n) => { r[n.id] = true; }); this.setState({ read: r }); },\n      isLoading: loading, isError: error, isEmpty: empty, isReady: !loading && !error && !empty,\n      emptyTitle: emptyText[0], emptyBody: emptyText[1],\n      showAll: () => this.setState({ filter: 'all' }),\n      retry: () => { this.setState({ retrying: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ retrying: false, recovered: true }), 1200); }\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "OrgVerify": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · Become a host\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;background:#0E0F13}\n*{box-sizing:border-box}\na{color:#FFB547;text-decoration:none}a:hover{color:#FFCB7A}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: 844px; background: #0E0F13; color: #F5F2EA; font-family: Manrope, sans-serif; position: relative; overflow: hidden\">\n  \u003cdiv style=\"position: absolute; left: 0; right: den\">\n                \u003cdiv style=\"position: absolute; left: 0; right: 0; top: 0; height: 18px; background: #2E7D5B\">\u003c/div>\n                \u003csc-if value=\"{{s.isFront}}\" hint-placeholder-val=\"{{true}}\">\n                  \u003cdiv style=\"position: absolute; left: 14px; top: 28px; width: 50px; height: 64px; border-radius: 6px; background: #A9B8AB\">\u003c/div>\n                  \u003cdiv style=\"position: absolute; left: 76px; top: 32px; right: 18px; display: flex; flex-direction: column; gap: 8px\">\n                    \u003cspan style=\"height: 8px; border-radius: 4px; background: #9AA89C; width: 80%\">\u003c/span>\n                    \u003cspan style=\"height: 8px; border-radius: 4px; background: #9AA89C; width: 60%\">\u003c/span>\n                    \u003cspan style=\"height: 8px; border-radius: 4px; background: #9AA89C; width: 70%\">\u003c/span>\n                  \u003c/div>\n                \u003c/sc-if>\n                \u003csc-if value=\"{{s.isBack}}\" hint-placeholder-val=\"{{false}}\">\n                  \u003cdiv style=\"position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px\">\n                    \u003cspan style=\"height: 7px; border-radius: 4px; background: #9AA89C\">\u003c/span>\n                    \u003cspan style=\"height: 7px; border-radius: 4px; background: #9AA89C\">\u003c/span>\n                    \u003cspan style=\"height: 7px; border-radius: 4px; background: #9AA89C; width: 70%\">\u003c/span>\n                  \u003c/div>\n                  \u003cdiv style=\"position: absolute; left: 14px; top: 28px; width: 46px; height: 32px; border-radius: 4px; background: #C6B57A\">\u003c/div>\n                \u003c/sc-if>\n              \u003c/div>\n              \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700\">\n                \u003cspan style=\"color: #3BD68E; display: flex; align-items: center; g osts 5% per ticket sold, nothing for free events.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"position: absolute; left: 0; right: 0; bottom: 0; background: #0E0F13; border-top: 1px solid #2C2D36; padding: 16px 20px 32px\">\n    \u003cbutton onClick=\"{{submit}}\" disabled=\"{{notReady}}\" style=\"{{submitStyle}}\">{{submitLabel}}\u003c/button>\n  \u003c/div>\n\n  \u003csc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cdiv role=\"dialog\" aria-label=\"Under review\" style=\"position: absolute; inset: 0; background: #0E0F13; padding: 140px 24px 32px; display: flex; flex-direction: column; align-items: center; text-align: center\">\n      \u003cdiv style=\"width: 110px; height: 112px; border-radius: 34px; background: #2A2113; display: flex; align-items: center; justify-content: center\">\n        \u003csvg width=\"54\" height=\"54\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFB547\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"13\" r=\"8\">\u003c/circle>\u003cpath d=\"M12 9v4l2.5 2.5M9 2h6\">\u003c/path>\u003c/svg>\n      \u003c/div>\n      \u003ch2 style=\"margin: 28px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em\">ID received\u003c/h2>\n      \u003cp style=\"margin: 12px 0 0; color: #A3A09A; font-size: 16px; font-weight: 600; line-height: 1.5; max-width: 300px\">We usually confirm within 24 hours by email. Meanwhile you can build your first event as a draft.\u003c/p>\n      \u003ca href=\"Dashboard.dc.html\" style=\"margin-top: auto; width: 100%; height: 56px; border-radius: 18px; background: #FFB547; color: #1A1203; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center\">Open host space\u003c/a>\n    \u003c/div>\n  \u003c/sc-if>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { front: 'done', back: 'empty', spin: 0, done: false }; }\n  componentWillUnmount() { clearTimeout(this.t); clearInterval(this.s); }\n  renderVals() {\n    const st = this.state;\n    const run = (side) => {\n      this.setState({ [side]: 'checking' });\n      clearInterval(this.s);\n      this.s = setInterval(() => this.setState((x) => ({ spin: x.spin + 90 })), 250);\n      clearTimeout(this.t);\n      this.t = setTimeout(() => { clearInterval(this.s); this.setState({ [side]: 'done' }); }, 1100);\n    };\n    const pills = { empty: ['Needed', 'background: #2A2113; color: #FFB547'], checking: ['Checking', 'background: #22232B; color: #D9D5CC'], done: ['Added', 'background: #10301F; color: #3BD68E'] };\n    const sides = [\n      { id: 'front', label: 'Front of your ID', sketch: 'M14 18h26v36H14zM50 22h50M50 34h40M50 46h46' },\n      { id: 'back', label: 'Back of your ID', sketch: 'M14 16h24v16H14zM14 50h92M14 58h92M14 66h60' }\n    ].map((s) => {\n      const v = st[s.id];\n      return {\n        ...s,\n        isEmpty: v === 'empty', isChecking: v === 'checking', isDone: v === 'done',\n        isFront: s.id === 'front', isBack: s.id === 'back',\n        thumbLabel: s.label + ' photo added',\n        pill: pills[v][0],\n        pillStyle: 'height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; ' + pills[v][1],\n        cardStyle: 'background: #17181E; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: ' + (v === 'done' ? '1px solid #1F5A3B' : v === 'empty' ? '2px solid #FFB547' : '1px solid #2C2D36'),\n        take: () => run(s.id),\n        retake: () => this.setState({ [s.id]: 'empty' })\n      };\n    });\n    const n = (st.front === 'done' ? 1 : 0) + (st.back === 'done' ? 1 : 0);\n    const ready = n === 2;\n    return {\n      sides,\n      tips State({ editing: false, err: '' }),\n      ccp: s.ccp, keyIn: s.keyIn,\n      onCcp: (e) => this.setState({ ccp: e.target.value.replace(/[^0-9]/g, '').slice(0, 10) }),\n      onKey: (e) => this.setState({ keyIn: e.target.value.replace(/[^0-9]/g, '').slice(0, 2) }),\n      ccpStyle: field(s.err && s.ccp.length !== 10),\n      keyStyle: field(s.err && s.keyIn.length !== 2),\n      err: s.err,\n      saveAccount: () => {\n        if (s.ccp.length !== 10 || s.keyIn.length !== 2) { this.setState({ err: 'A CCP number has 10 digits and the clé has 2.' }); return; }\n        this.setState({ editing: false, last4: s.ccp.slice(-4), key: s.keyIn, err: '' });\n      }\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "Profile": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · Profile and balance\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;background:#0E0F13}\n*{box-sizing:border-box}\na{color:#FFB547;text-decoration:none}a:hover{color:#FFCB7A}\nbutton{font:inherit;cursor:pointer}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: 844px; background: #0E0F13; color: #F5F2EA; font-family: Manrope, sans-serif; position: relative; overflow: hidden\">\n  \u003cdiv style=\"position: absolute; left: 0; right: 0; top: 0; bottom: 86px; overflow-y: auto\">\n    \u003cdiv style=\"padding: 60px 20px 28px; display: flex; flex-direction: column; gap: 16px\">\n\n      \u003cdiv style=\"display: flex; align-items: center; gap: 16px\">\n        \u003cdiv style=\"width: 60px; height: 60px; border-radius: 20px; background: #FFB547; /x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"state\":{\"editor\":\"enum\",\"options\":[\"live\",\"loading\",\"empty\",\"error\"],\"default\":\"live\"},\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { removed: {}, retrying: false, recovered: false }; }\n  componentWillUnmount() { clearTimeout(this.t); }\n  renderVals() {\n    const forced = this.props.state || 'live';\n    const all = [\n      { id: 'rai', title: 'Raï Nights Live', poster: 'RAÏ NIGHTS', meta: 'Fri 23 Oct · 21:00 · Oran', status: 'Only 18 VIP left', urgent: true, bg: '#FFB547', fg: '#1A1203' },\n      { id: 'derby', title: 'Derby Algérois', poster: 'DERBY', meta: 'Sat 24 Oct · 17:45 · Alger', status: 'Reminder set for Fri 23 Oct', urgent: false, bg: '#3BD68E', fg: '#06210F' }\n    ];\n    const items = all.filter((i) => !this.state.removed[i.id]).map((i) => ({\n      ...i,\n      removeLabel: 'Remove ' + i.title + ' from saved',\n      remove: () => this.setState({ removed: { ...this.state.removed, [i.id]: true } }),\n      posterStyle: 'height: 96px; position: relative; overflow: hidden; background: ' + i.bg,\n      circleStyle: 'position: absolute; right: -30px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: #0E0F13',\n      titleStyle: \"position: absolute; left: 14px; bottom: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; color: \" + i.fg,\n      statusStyle: 'align-self: flex-start; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; ' + (i.urgent ? 'background: #2A2113; color: #FFB547' : 'background: #10301F; color: #3BD68E')\n    }));\n    const loading = forced === 'loading' || this.state.retrying;\n    const error = forced === 'error' && !this.state.retrying && !this.state.recovered;\n    const empty = !loading && !error && ((forced === 'empty' && !this.state.recovered) || items.length === 0);\n    const ready = !loading && !error && !empty;\n    return {\n      items,\n      count: forced === 'empty' ? 0 : items.length,\n      subtitle: ready ? items.length + (items.length === 1 ? ' event' : ' events') + ' · we remind you the day before' : 'Events you want to keep an eye on',\n      isLoading: loading, isError: error, isEmpty: empty, isReady: ready,\n      retry: () => {\n        this.setState({ retrying: true });\n        clearTimeout(this.t);\n        this.t = setTimeout(() => this.setState({ retrying: false, recovered: true }), 1200);\n      }\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "ScanJoin": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · Scan tickets for a host\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;background:#0E0F13}\n*{box-sizing:border-box}\na{color:#FFB547;text-decoration:none}a:hover{color:#FFCB7A}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed}\ninput::placeholder{color:#6B6862}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: 844px; background: #0E0F13; color: #F5F2EA; font-family: Manrope, sans-serif; position: relative; overflow: hidden\">\n  \u003cdiv style=\"position: absolute; left: 0; right: 0; top: 0; bottom: 101px; overflow-y: auto\">\n    \u003cdiv style=\"padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 16px\">\n      \u003cdiv style=\"display: flex; align-items: center; gap: 12px; margin-left: -4px\">\n        \u003csc-if value=\"{{backIsLink}}\" hint-placeholder-val=\"{{true}}\">\n          \u003ca href=\"Profile.dc.html\" aria-label=\"Back to profile\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #22232B; display: flex; align-items: center; justify-content: center; color: #F5F2EA; flex-shrink: 0\">\n            \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>\n          \u003c/a>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{backIsStep}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cbutton onClick=\"{{back}}\" aria-label=\"Previous step\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #22232B; border: 0; display: flex; align-items: center; justify-content: center; color: #F5F2EA; flex-shrink: 0\">\n            \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>\n          \u003c/button>\n        \u003c/sc-if>\n        \u003cdiv style=\"flex: 1; line-height: 1.2\">\n          \u003cdiv style=\"font-size: 13px; color: #A3A09A; font-weight: 700\">{{kicker}}\u003c/div>\n          \u003cdiv style=\"font-weight: 800; font-size: 16px\">Scan tickets for a host\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003csc-if value=\"{{showSteps}}\" hint-placeholder-val=\"{{true}}\">\n        \u003col aria-label=\"Progress\" style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n          \u003csc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"3\">\n            \u003cli aria-current=\"{{st.current}}\" style=\"display: flex; flex-direction: column; gap: 8px\">\u003cspan style=\"{{st.barStyle}}\">\u003c/span>\u003cspan style=\"{{st.labelStyle}}\">{{st.label}}\u003c/span>\u003c/li>\n          \u003c/sc-for>\n        \u003c/ol>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{isStart}}\" hint-placeholder-val=\"{{true}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cdiv>\n            \u003ch1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em\">Help at the door\u003c/h1>\n            \u003cp style=\"margin: 8px 0 0; color: #A3A09A; font-size: 14px; font-weight: 600; line-height: 1.5\">No host account needed. Ask the host for two things: the event code and the PIN of your gate.\u003c/p>\n          \u003c/div>\n          \u003clabel style=\"display: flex; flex-direction: column; gap: 8px\">\n            \u003cspan style=\"font-size: 13px; font-weight: 800\">Event code\u003c/span>\n            \u003cinput value=\"{{eventCode}}\" onChange=\"{{onEventCode}}\" placeholder=\"RAI-2310\" autocapitalize=\"characters\" style=\"{{eventInputStyle}}\">\n          \u003c/label>\n          \u003csc-if value=\"{{eventError}}\" hint-placeholder-val=\"{{false}}\">\u003cspan role=\"alert\" style=\"font-size: 13px; font-weight: 700; color: #FF8A8A; margin-top: -8px\">{{eventError}}\u003c/span>\u003c/sc-if>\n          \u003cdiv style=\"font-size: 13px; color: #6B6862; font-weight: 700; margin-top: -8px\">Demo code: RAI-2310\u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 12px; background: #17181E; border: 1px solid #2C2D36; border-radius: 18px; padding: 16px\">\n            \u003cspan style=\"font-size: 13px; color: #A3A09A; font-weight: 800; letter-spacing: 0.06em\">WHAT DOOR STAFF CAN DO\u003c/span>\n            \u003csc-for list=\"{{rules}}\" as=\"r\" hint-placeholder-count=\"3\">\n              \u003cspan style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 13px; font-weight: 700; color: #D9D5CC; line-height: 1.45\">\n                \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{r.color}}\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px\" aria-hidden=\"true\">\u003cpath d=\"{{r.icon}}\">\u003c/path>\u003c/svg>{{r.text}}\u003c/span>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{isGate}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cdiv style=\"display: flex; gap: 12px; align-items: center; background: #17181E; border: 1px solid #2C2D36; border-radius: 18px; padding: 12px\">\n            \u003cdiv style=\"width: 58px; height: 60px; border-radius: 12px; background: #FFB547; position: relative; overflow: hidden; flex-shrink: 0\">\u003cdiv style=\"position: absolute; right: -14px; top: -14px; width: 50px; height: 52px; border-radius: 50%; background: #0E0F13\">\u003c/div>\u003c/div>\n            \u003cdiv style=\"flex: 1; line-height: 1.3\">\n              \u003cdiv style=\"font-weight: 800; font-size: 16px\">Raï Nights Live\u003c/div>\n              \u003cdiv style=\"font-size: 13px; color: #A3A09A; font-weight: 600\">Fri 23 Oct · Théâtre de Verdure, Oran\u003c/div>\n              \u003cdiv style=\"font-size: 13px; color: #3BD68E; font-weight: 800\">Hosted by Oran Events Co. ✓\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003ch1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px\">Which gate are you on?\u003c/h1>\n          \u003cdiv role=\"radiogroup\" aria-label=\"Gate\" style=\"display: flex; flex-direction: column; gap: 8px\">\n            \u003csc-for list=\"{{gates}}\" as=\"g\" hint-placeholder-count=\"3\">\n              \u003cbutton role=\"radio\" aria-checked=\"{{g.checked}}\" onClick=\"{{g.pick}}\" style=\"{{g.style}}\">\n                \u003cspan style=\"{{g.badgeStyle}}\">{{g.letter}}\u003c/span>\n                \u003cspan style=\"flex: 1; text-align: left; line-height: 1.3\">\n                  \u003cspan style=\"display: block; font-weight: 800; font-size: 16px; color: #F5F2EA\">{{g.name}}\u003c/span>\n                  \u003cspan style=\"display: block; font-size: 13px; color: #A3A09A; font-weight: 600\">{{g.tiers}}\u003c/span>\n                \u003c/span>\n                \u003cspan style=\"{{g.radioStyle}}\">\u003c/span>\n              \u003c/button>\n            \u003c/sc-for>\n          \u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{isPin}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cdiv>\n            \u003ch1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px\">PIN for Gate {{gate}}\u003c/h1>\n            \u003cp style=\"margin: 8px 0 0; color: #A3A09A; font-size: 14px; font-weight: 600; line-height: 1.5\">The host made a 6-digit PIN for this gate only. It proves the host chose you.\u003c/p>\n          \u003c/div>\n          \u003clabel style=\"{{pinWrapStyle}}\">\n            \u003cspan style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Gate PIN\u003c/span>\n            \u003cinput value=\"{{pin}}\" onChange=\"{{onPin}}\" inputmode=\"numeric\" placeholder=\"••••••\" maxlength=\"6\" style=\"width: 100%; background: none; border: 0; outline: none; color: #F5F2EA; font: 800 30px 'JetBrains Mono', monospace; letter-spacing: 0.5em; text-align: center\">\n          \u003c/label>\n          \u003csc-if value=\"{{pinError}}\" hint-placeholder-val=\"{{false}}\">\u003cspan role=\"alert\" style=\"font-size: 13px; font-weight: 700; color: #FF8A8A\">{{pinError}}\u003c/span>\u003c/sc-if>\n          \u003cdiv style=\"font-size: 13px; color: #6B6862; font-weight: 700\">Demo PINs · A 482193 · B 739051 · C 156408\u003c/div>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{isWaiting}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv role=\"status\" style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 0 4px\">\n            \u003cdiv style=\"width: 84px; height: 84px; border-radius: 24px; background: #2A2113; display: flex; align-items: center; justify-content: center\">\n              \u003csvg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFB547\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 7v5l3 2\">\u003c/path>\u003c/svg>\n            \u003c/div>\n            \u003ch1 style=\"margin: 16px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px\">PIN accepted. Waiting for the host\u003c/h1>\n            \u003cp style=\"margin: 8px 0 0; color: #A3A09A; font-size: 14px; font-weight: 600; line-height: 1.5\">The host sees your name and Gate {{gate}} and approves you. A PIN alone is not enough, so a leaked PIN can't let strangers in.\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"background: #17181E; border: 1px solid #2C2D36; border-radius: 16px; padding: 16px; display: flex; gap: 12px; align-items: center\">\n            \u003cspan style=\"width: 40px; height: 40px; border-radius: 12px; background: #22232B; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">AB\u003c/span>\n            \u003cspan style=\"flex: 1; line-height: 1.35\">\u003cspan style=\"display: block; font-weight: 800; font-size: 14px\">Amine B. · Gate {{gate}}\u003c/span>\u003cspan style=\"display: block; font-size: 13px; color: #A3A09A; font-weight: 600\">Sent {{waitSecs}}s ago · we'll notify you\u003c/span>\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"font-size: 13px; color: #6B6862; font-weight: 700; text-align: center\">Demo: the host approves after 4 seconds\u003c/div>\n          \u003cbutton onClick=\"{{cancelRequest}}\" style=\"height: 48px; border-radius: 16px; background: none; border: 1px solid #2C2D36; color: #F5F2EA; font-weight: 800; font-size: 14px\">Cancel request\u003c/button>\n        \u003c/div>\n      \u003c/sc-if>\n\n      \u003csc-if value=\"{{isReady}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n          \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 0 4px\">\n            \u003cdiv style=\"width: 84px; height: 84px; border-radius: 26px; background: #3BD68E; display: flex; align-items: center; justify-content: center\">\n              \u003csvg width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06210F\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"m5 12 5 5L20 7\">\u003c/path>\u003c/svg>\n            \u003c/div>\n            \u003ch1 style=\"margin: 16px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px\">You're on Gate {{gate}}\u003c/h1>\n            \u003cp style=\"margin: 8px 0 0; color: #A3A09A; font-size: 14px; font-weight: 600; line-height: 1.5\">Saved on this phone. Come back from Profile any time; no codes needed again.\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"background: #17181E; border: 1px solid #2C2D36; border-radius: 18px; padding: 4px 16px\">\n            \u003csc-for list=\"{{access}}\" as=\"a\" hint-placeholder-count=\"4\">\n              \u003cdiv style=\"{{a.rowStyle}}\">\u003cspan style=\"color: #A3A09A\">{{a.k}}\u003c/span>\u003c n      gateAria: staff ? 'Gate ' + gate + ', set by the host' : 'Gate ' + gate + ', tap to switch gate',\n      nextGate: () => { if (!staff) this.setState({ gate: order[(order.indexOf(s.gate) + 1) % 3], result: null }); },\n      exit: () => { if (p.onExit) p.onExit(); },\n      torchPressed: s.torch ? 'true' : 'false',\n      toggleTorch: () => this.setState({ torch: !s.torch }),\n      torchStyle: 'width: 44px; height: 44px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; ' + (s.torch ? 'background: #FFB547; color: #1A1203' : 'background: rgba(34,35,43,0.9); color: #F5F2EA'),\n      sceneStyle: 'position: absolute; inset: 0; transition: opacity 0.3s; opacity: ' + (s.torch ? '1' : '0.45'),\n      lineStyle: 'position: absolute; left: 18px; right: 18px; height: 3px; border-radius: 999px; background: #FFB547; box-shadow: 0 0 18px 4px rgba(255,181,71,0.45); transition: top 1.2s ease-in-out; top: ' + (s.low ? '88%' : '8%'),\n      countLabel: staff ? s.mine + ' scanned by you · ' + s.count + ' in' : s.count + ' / 910 in',\n      queued: s.queued,\n      cardStyle: 'border-radius: 24px; padding: 16px; display: flex; gap: 16px; align-items: center; background: ' + look[0] + '; color: ' + look[1],\n      iconBoxStyle: 'width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + look[2],\n      iconColor: look[3], iconPath: look[4],\n      resultTitle: r.kind === 'idle' ? 'Ready to scan' : r.title,\n      resultName: r.kind === 'idle' ? 'Gate ' + gate + ' · ' + gateInfo[gate][1] : r.name,\n      resultMeta: r.kind === 'idle' ? 'Works offline. Scans sync when the network is back.' : r.meta,\n      scan: () => apply(tickets[s.i % tickets.length]),\n      typing: s.typing, notTyping: !s.typing,\n      code: s.code,\n      onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '').slice(0, 4) }),\n othing else.', icon: 'M3 5h18v14H3zM3 7l9 6 9-6', ...tint('#6EC1FF', '#0F2A3D') },\n      { title: 'Tickets belong to you', body: 'Send them by email or resell at face value inside Tiki. Tickets sold elsewhere can be cancelled.', icon: 'M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z', ...tint('#FFB547', '#2A2113') },\n      { title: 'Your balance stays yours', body: 'Top-ups never expire. Withdraw to CCP any time. Cancelled event? The refund is automatic.', icon: 'M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 14h2', ...tint('#3BD68E', '#10301F') },\n      { title: 'One scan per ticket', body: 'The live code refreshes, so screenshots do not get in. Bring your phone.', icon: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16', ...tint('#B5A3FF', '#221A40') },\n      { title: 'We never sell your data', body: 'Handled under Algeria’s Law 18-07 on personal data. Delete your account any time.', icon: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z', ...tint('#3BD68E', '#10301F') }\n    ];\n    const secDefs = [\n      ['Using Tiki', 'Tiki connects fans with verified hosts. You must be 16 or older, or use Tiki with a parent. One person, one account.'],\n      ['Buying and refunds', 'Prices shown are final, with no fees added at checkout. If a host cancels, the full amount returns to your Tiki balance within minutes. If you cannot go, you can resell at face value.'],\n      ['Transfers and resale', 'You may send a ticket to another Tiki account by email for free, or resell it inside Tiki at the price you paid. Selling tickets above face value or outside Tiki breaks these terms.'],\n      ['Tiki balance', 'Money you add is held for you until you spend or withdraw it. We do not charge for keeping a balance. Withdrawals go to a CCP account in your name.'],\n      ['Hosts and door staff', 'Hosts must pass an ID check and are responsible for their events. Door staff only scan at the gate they were approved for. Payouts are released 48 hours after the event to protect buyers.'],\n      ['Privacy', 'We store your email, tickets and payment history to run the service. We do not sell personal data. You can download or delete your data from Profile at any time.']\n    ];\n    const sections = secDefs.map(([title, text], i) => {\n      const open = s.open === i;\n      return {\n        num: String(i + 1).padStart(2, '0'), title, text, isOpen: open, expanded: open ? 'true' : 'false',\n        toggle: () => this.setState({ open: open ? -1 : i }),\n        chevronStyle: 'flex-shrink: 0; transition: transform 0.2s; transform: rotate(' + (open ? 180 : 0) + 'deg)',\n        rowStyle: i \u003c secDefs.length - 1 ? 'border-bottom: 1px solid #22232B' : ''\n      };\n    });\n    return {\n      points, sections,\n      isAccept: accept, isRead: !accept, canDismiss: !accept,\n      subtitle: accept ? 'One last step before you start · updated 16 Oct 2026' : 'Updated 16 Oct 2026',\n      agreed: s.agreed, notAgreed: !s.agreed,\n      toggleAgree: () => this.setState({ agreed: !s.agreed }),\n      continueHref: p.continueHref || 'Main.dc.html',\n      close: () => { if (p.onClose) p.onClose(); }\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "Ticket": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · E-ticket\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0;background:#0E0F13}\n*{box-sizing:border-box}\na{color:#FFB547;text-decoration:none}a:hover{color:#FFCB7A}\nbutton{font:inherit;cursor:pointer}\n\ src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0}\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: rgba(5,5,7,0.72); font-family: Manrope, sans-serif; color: #F5F2EA\">\n  \u003cbutton aria-label=\"Close top up\" onClick=\"{{close}}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; background: none; border: 0; cursor: pointer\">\u003c/button>\n  \u003csection role=\"dialog\" aria-label=\"Top up your balance\" style=\"position: absolute; left: 0; right: 0; bottom: 0; background: #17181E; border-radius: 28px 28px 0 0; border-top: 1px solid #2C2D36; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n    \u003cdiv style=\"width: 40px; height: 5px; border-radius: 999px; background: #3A3B45; margin: 0 auto\">\u003c/div>\n    \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      \u003ch2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800\">{{heading}}\u003c/h2>\n      \u003cspan style=\"font-size: 13px; color: #A3A09A; font-weight: 700\">Now {{balanceLabel}}\u003c/span>\n    \u003c/div>\n\n    \u003csc-if value=\"{{isPick}}\" hint-placeholder-val=\"{{true}}\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n    \u003cdiv role=\"radiogroup\" aria-label=\"Quick amounts\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n      \u003csc-for list=\"{{amounts}}\" as=\"a\" hint-placeholder-count=\"3\">\n        \u003cbutton role=\"radio\" aria-c eholder-count=\"4\">\n        \u003cbutton role=\"radio\" aria-checked=\"{{m.checked}}\" onClick=\"{{m.pick}}\" style=\"{{m.style}}\">\n          \u003cspan style=\"{{m.logoStyle}}\">{{m.mark}}\u003c/span>\n          \u003cspan style=\"flex: 1; text-align: left; line-height: 1.3\">\n            \u003cspan style=\"display: block; font-weight: 800; font-size: 14px; color: #F5F2EA\">{{m.name}}\u003c/span>\n            \u003cspan style=\"display: block; font-size: 13px; color: #A3A09A; font-weight: 600\">{{m.sub}}\u003c/span>\n          \u003c/span>\n          \u003cspan style=\"{{m.radioStyle}}\">\u003c/span>\n        \u003c/button>\n      \u003c/sc-for>\n    \u003c/div>\n\n    \u003csc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv role=\"status\" style=\"height: 56px; border-radius: 18px; background: #10301F; color: #3BD68E; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"m5 12 5 5L20 7\">\u003c/path>\u003c/svg>{{doneText}}\u003c/div>\n    \u003c/sc-if>\n    \u003csc-if value=\"{{showCta}}\" hint-placeholder-val=\"{{true}}\">\n      \u003cbutton onClick=\"{{confirm}}\" disabled=\"{{ctaDisabled}}\" style=\"{{ctaStyle}}\">\n        \u003csc-if value=\"{{loading}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cspan style=\"{{spinStyle}}\">\u003c/span>\n        \u003c/sc-if>\n        {{cta}}\n      \u003c/button>\n    \u003c/sc-if>\n    \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isOtp}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n        \u003cdiv style=\"font-size: 14px; color: #B9B5AD; font-weight: 600; line-height: 1.5\">{{otpText}}\u003c/div>\n        \u003cinput aria-lab   \u003cbutton onClick=\"{{approveDemo}}\" style=\"height: 56px; border-radius: 16px; background: #FFB547; border: 0; color: #1A1203; font: 800 16px Manrope, sans-serif; cursor: pointer\">I approved it\u003c/button>\n        \u003cbutton onClick=\"{{backToPick}}\" style=\"height: 48px; background: none; border: 0; color: #A3A09A; font: 800 14px Manrope, sans-serif; cursor: pointer\">Cancel request\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isCash}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px\">\n        \u003cdiv style=\"background: #0E0F13; border: 1px dashed #4A4B55; border-radius: 20px; padding: 20px; text-align: center\">\n          \u003cdiv style=\"font-size: 13px; color: #A3A09A; font-weight: 800; letter-spacing: 0.06em\">SHOW THIS CODE AT THE COUNTER\u003c/div>\n          \u003cdiv style=\"font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 8px; letter-spacing: 0.08em\">TK 4821 9930\u003c/div>\n          \u003cdiv style=\"font-size: 14px; font-weight: 800; color: #FFB547; margin-top: 8px\">Pay {{valueLabel}} · valid {{cashTimer}}\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"font-size: 13px; color: #B9B5AD; font-weight: 600; line-height: 1.5\">Any Algérie Poste office. Your balance updates a few minutes after you pay, and we notify you. If the code expires, nothing is charged.\u003c/div>\n        \u003cbutton onClick=\"{{copyCode}}\" style=\"height: 56px; border-radius: 16px; background: #FFB547; border: 0; color: #1A1203; font: 800 16px Manrope, sans-serif; cursor: pointer\">{{copyLabel}}\u003c/button>\n        \u003cbutton onClick=\"{{close}}\" style=\"height: 48px; background: none; border: 0; color: #A3A09A; font: 800 14px Manrope, sans-serif; cursor: pointer\">Done · I'll pay later\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isFailed}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv role=\"alert\" style=\"display: flex; flex-direction: column; gap: 16px\">\n        \u003cdiv style=\"display: flex; gap: 12px; align-items: flex-start; background: #3A1414; border-radius: 16px; padding: 16px\">\n          \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FF8A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 7v6M12 16.5h.01\">\u003c/path>\u003c/svg>\n          \u003cspan style=\"line-height: 1.45\">\u003cspan style=\"display: block; font-weight: 800; font-size: 14px; color: #FF8A8A\">Your bank declined this payment\u003c/span>\u003cspan style=\"display: block; font-size: 13px; color: #F0C4C4; font-weight: 600; margin-top: 4px\">No money was taken. Check the card balance or try BaridiMob or cash instead.\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cbutton onClick=\"{{retry}}\" style=\"height: 56px; border-radius: 16px; background: #FFB547; border: 0; color: #1A1203; font: 800 16px Manrope, sans-serif; cursor: pointer\">Try again\u003c/button>\n        \u003cbutton onClick=\"{{backToPick}}\" style=\"height: 48px; background: none; border: 0; color: #A3A09A; font: 800 14px Manrope, sans-serif; cursor: pointer\">Use another method\u003c/button>\n      \u003c/div>\n    \u003c/sc-if>\n  \u003c/section>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"balance\":{\"editor\":\"int\",\"default\":3500},\"suggested\":{\"editor\":\"int\",\"default\":0},\"onClose\":{\"editor\":null},\"onDone\":{\"editor\":null},\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const sug = props.suggested || 0;\n    this.state = { amount: sug > 0 ? sug : 10000, custom: '', method: 'edahabia', loading: false, done: 0, spin: 0, stage: 'pick', otp: '', secs: 7200, copied: u003c/button>\n      \u003c/sc-for>\n      \u003csc-if value=\"{{noMatch}}\" hint-placeholder-val=\"{{false}}\">\n        \u003cdiv style=\"padding: 32px 12px; text-align: center; color: #A3A09A; font-size: 14px; font-weight: 600\">No wilaya matches “{{query}}”. Try the name in French or its number.\u003c/div>\n      \u003c/sc-if>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"selected\":{\"editor\":\"text\",\"default\":\"Alger\"},\"onPick\":{\"editor\":null},\"onClose\":{\"editor\":null},\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { query: '', local: null }; }\n  renderVals() {\n    const names = ['Adrar', 'Chlef', 'Laghouat', 'Oum El Bouaghi', 'Batna', 'Béjaïa', 'Biskra', 'Béchar', 'Blida', 'Bouira', 'Tamanrasset', 'Tébessa', 'Tlemcen', 'Tiaret', 'Tizi Ouzou', 'Alger', 'Djelfa', 'Jijel', 'Sétif', 'Saïda', 'Skikda', 'Sidi Bel Abbès', 'Annaba', 'Guelma', 'Constantine', 'Médéa', 'Mostaganem', \"M'Sila\", 'Mascara', 'Ouargla', 'Oran', 'El Bayadh', 'Illizi', 'Bordj Bou Arréridj', 'Boumerdès', 'El Tarf', 'Tindouf', 'Tissemsilt', 'El Oued', 'Khenchela', 'Souk Ahras', 'Tipaza', 'Mila', 'Aïn Defla', 'Naâma', 'Aïn Témouchent', 'Ghardaïa', 'Relizane', 'Timimoun', 'Bordj Badji Mokhtar', 'Ouled Djellal', 'Béni Abbès', 'In Salah', 'In Guezzam', 'Touggourt', 'Djanet', \"El M'Ghair\", 'El Meniaa'];\n    const counts = { 'Alger': 42, 'Oran': 38, 'Constantine': 17, 'Annaba': 11, 'Tlemcen': 9, 'Béjaïa': 8, 'Sétif': 7, 'Blida': 6, 'Tizi Ouzou': 5 };\n    const popular = ['Alger', 'Oran', 'Constantine', 'Annaba'];\n    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');\n    const q = norm(this.state.query.trim());\n    const selected = this.state.local || this.props.selected || 'Alger';\n    let list = names.map((n, i) => ({ n, code: String(i + 1).padStart(2, '0') }));\n    if (q) list = list.filter((w) => norm(w.n).includes(q) || w.code === q.padStart(2, '0'));\n    else list = popular.map((p) => list.find((w) => w.n === p)).concat(list.filter((w) => popular.indexOf(w.n) \u003c 0));\n    const pick = (n) => {\n      this.setState({ local: n });\n      if (this.props.onPick) this.props.onPick(n);\n    };\n    const rows = list.map((w) => {\n      const on = w.n === selected;\n      const c = counts[w.n] || 0;\n      return {\n        name: w.n, code: w.code,\n        events: c ? c + ' events' : 'Soon',\n        selected: on ? 'true' : 'false',\n        isSelected: on,\n        pick: () => pick(w.n),\n        style: 'width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 14px; cursor: pointer; color: #F5F2EA; font-family: Manrope, sans-serif; ' + (on ? 'background: #2A2113' : 'background: none'),\n        codeStyle: \"width: 36px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; flex-shrink: 0; \" + (on ? 'background: #FFB547; color: #1A1203' : 'background: #22232B; color: #D9D5CC')\n      };\n    });\n    return {\n      rows,\n      query: this.state.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      listLabel: q ? rows.length + ' RESULTS' : 'POPULAR, THEN ALL 58 WILAYAS',\n      noMatch: rows.length === 0,\n      close: () => { if (this.props.onClose) this.props.onClose(); },\n      useLocation: () => pick('Alger')\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "MainAR": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Tiki · Discover\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family >\n    \u003c/div>\n  \u003c/sc-if>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"lang\":{\"editor\":\"enum\",\"options\":[\"en\",\"ar\"],\"default\":\"ar\"},\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { secs: 30, flip: false, idx: 0, sheet: null, saved: false }; }\n  componentDidMount() {\n    this.t = setInterval(() => this.setState((s) => (s.secs > 1 ? { secs: s.secs - 1 } : { secs: 30, flip: !s.flip })), 1000);\n  }\n  componentWillUnmount() { clearInterval(this.t); }\n  renderVals() {\n    const s = this.state;\n    const ar = this.props.lang === 'ar';\n    const T = ar ? {\n      title: 'تذاكرك', offline: 'يعمل دون إنترنت', when: 'الجمعة 23 أكتوبر · الأبواب 20:00',\n      guest: 'الضيف', guestVal: 'أمين ب.', gate: 'البوابة', ticket: 'التذكرة', gateVal: 'A · المسار السريع',\n      send: 'إرسال بالبريد', resell: 'إعادة البيع', save: 'حفظ في الهاتف', saved: 'تم الحفظ', switchLabel: 'اختر التذكرة'\n    } : {\n      title: 'Your tickets', offline: 'Works offline', when: 'Fri 23 Oct · Doors 20:00',\n      guest: 'GUEST', guestVal: 'Amine B.', gate: 'GATE', ticket: 'TICKET', gateVal: 'A · Fast lane',\n      send: 'Send by email', resell: 'Resell', save: 'Save to phone', saved: 'Saved', switchLabel: 'Choose a ticket'\n    };\n    const sec = s.secs;\n    const dots = [0, 1, 2, 3].map((i) => ({\n      selected: i === s.idx ? 'true' : 'false',\n      label: (ar ? 'التذكرة ' : 'Ticket ') + (i + 1),\n      pick: () => this.setState({ idx: i }),\n      style: 'height: 8px; border-radius: 999px; transition: width 0.2s; width: ' + (i === s.idx ? '24px' : '8px') + '; background: ' + (i === s.idx ? '#FFB547' : '#3A3B45')\n    }));\n    const font = ar ? \"'IBM Plex Sans Arabic', Manrope, sans-serif\" : 'Manrope, sans-serif';\n    return {\n      t: T, dots,\n      dir: ar ? 'rtl' : 'ltr',\n      rootStyle: 'width: 390px; height: 844px; background: #0E0F13; color: #F5F2EA; font-family: ' + font + '; position: relative; overflow: hidden',\n      h1Style: 'flex: 1; margin: 0; font-size: 22px; font-weight: 800; font-family: ' + (ar ? \"'IBM Plex Sans Arabic', sans-serif\" : \"'Bricolage Grotesque', sans-serif\"),\n      ticketVal: ar ? (s.idx + 1) + ' من 4' : (s.idx + 1) + ' of 4',\n      code: 'TK-ORN-23A7-014' + (2 + s.idx),\n      liveLabel: ar ? 'رمز مباشر · يتجدد بعد ' + sec + ' ث' : 'Live code · refreshes in ' + sec + 's',\n      qrStyle: 'display: block; transition: transform 0.4s ease; transform: rotate(' + ((s.flip ? 90 : 0) + s.idx * 180) + 'deg)',\n      barStyle: 'height: 100%; border-radius: 999px; background: #14151A; transition: width 1s linear; width: ' + Math.round((sec / 30) * 100) + '%',\n      saveLabel: s.saved ? T.saved : T.save,\n      saveToPhone: () => this.setState({ saved: true }),\n      sheetOpen: !!s.sheet, sheetMode: s.sheet || 'send',\n      openSend: () => this.setState({ sheet: 'send' }),\n      openResell: () => this.setState({ sheet: 'resell' }),\n      closeSheet: () => this.setState({ sheet: null })\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

var NOTES = ["What ticketing in Algeria gets wrong → how Tiki fixes it\n\n• Sites crash when big matches go on sale → a fair waiting room that keeps your place, even offline\n\n• Fake tickets and black-market resale → tickets tied to a Tiki account, a live QR that refreshes every 30 s, send by email or resell only inside Tiki at face value\n\n• Card payments fail at checkout → a Tiki balance: top up any amount with Edahabia, CIB, BaridiMob or cash at the post office, then every ticket is one tap. Refunds and resales flow back to the balance\n\n• Queues at the guichet → buy in-app, ticket opens with no network\n\n• Heavy apps, expensive data → Lite build under 10 MB, data saver, AR / FR / EN\n\n• Sign in with email + a 6-digit code, or Google, then accept the terms once in a sheet", "Host tools\n\n• Become a host with just your ID card (front + back photos). No selfie, no business papers\n\n• One event menu: edit, share link, pause sales, cancel with automatic refunds, switch between live, draft and past events\n\n• Create an event on ONE screen with a 4-step stepper (from Duhuze): basics, date & gates, tickets, publish. Drafts autosave\n\n• Gates are set while creating the event; each tier enters by its own gate\n\n• A ticket is valid once across ALL gates: the first scan locks it and records the gate and time\n\n• Door staff need no host account: event code → gate → gate PIN, then the host approves them by name. A leaked PIN alone lets nobody in\n\n• Payouts to CCP, released 48 h after the event, with an optional 30% advance", "Why components keep Tiki under 10 MB\n\n• 14 shared pieces power 17 screens: 2 navs, top-up, wilaya picker, filters, state view, confirm dialog, tier editor, event menu, guest list, scanner, terms, send/resell\n\n• Small jobs open as sheets, not new screens: terms, transfer, top-up, balance history, organizer\n\n• Every list has the same 4 states: loading, empty, error with retry, offline\n\n• No photos needed: covers are drawn in code. Icons are tiny inline SVG strokes", "Design standards (apply to every screen)\n\n• Type: 32 hero · 22 title · 16 body · 14 · 13 caption. Nothing under 13 except count badges\n\n• Spacing on a 4 px grid; tap targets 44 px or more\n\n• Root tabs: large title. Pushed screens: back + title + one action\n\n• One saffron primary button per screen; everything else is secondary\n\n• Arabic is a real layout, not a translation: right-to-left, IBM Plex Sans Arabic (see the lang tweak on Discover and Ticket)\n\n• No seat numbers: tickets are by zone and gate"];
