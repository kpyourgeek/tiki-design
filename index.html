var SUPPORT_URL = URL.createObjectURL(new Blob([SUPPORT], {type: 'text/javascript'}));
var PRE = "(function(){var P=parent,F=P.__TIKI_FILES,r={},b={};for(var k in F){r['./'+k+'.dc.html']='tiki:'+k;b['tiki:'+k]=new Blob([F[k]],{type:'text/html'});}window.__resources=r;window.__resourceBlobs=b;" +
  "document.addEventListener('click',function(e){var p=e.composedPath();for(var i=0;i<p.length;i++){var a=p[i];if(a&&a.tagName==='A'){var h=a.getAttribute('href')||'';var m=h.match(/([A-Za-z0-9]+)\\.dc\\.html/);if(m){e.preventDefault();P.tikiGo(m[1]);}else if(/^https?:/.test(h)){e.preventDefault();window.open(h,'_blank','noopener');}return;}}},true);})();";
function docFor(name){
  var html = window.__TIKI_FILES[name];
  var inject = '<base href="https://tiki.design/' + name + '.dc.html"><script>' + PRE + '<\/script><script src="' + SUPPORT_URL + '"><\/script>';
  return html.replace('<script src="./support.js"><\/script>', function(){ return inject; });
}
var byId = {}, all = [];
[['attendee','Attendee'],['host','Organizer'],['arabic','Arabic (RTL)'],['components','Shared components']].forEach(function(g){
  NAV[g[0]].forEach(function(it){ it.group = g[0]; byId[it.id] = it; all.push(it); });
});
var navEl = document.getElementById('nav');
[['attendee','Attendee'],['host','Organizer'],['arabic','Arabic (RTL)'],['components','Shared components']].forEach(function(g){
  var h = document.createElement('h3'); h.textContent = g[1]; navEl.appendChild(h);
  NAV[g[0]].forEach(function(it){
    var b = document.createElement('button'); b.className = 'item'; b.textContent = it.title; b.dataset.id = it.id;
    b.onclick = function(){ go(it.id, true); }; navEl.appendChild(b);
  });
});
var h = document.createElement('h3'); h.textContent = 'About'; navEl.appendChild(h);
var nb = document.createElement('button'); nb.className = 'item'; nb.textContent = 'Product & design notes'; nb.dataset.id = '__notes';
nb.onclick = function(){ showNotes(); }; navEl.appendChild(nb);

var stage = document.getElementById('stage'), titleEl = document.getElementById('title'), backBtn = document.getElementById('back');
var hist = [], cur = null, frameBox = null;
function mark(id){ document.querySelectorAll('.item').forEach(function(b){ b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'); }); }
function setView(v){ document.getElementById('vPhone').setAttribute('aria-pressed', v === 'phone'); document.getElementById('vGrid').setAttribute('aria-pressed', v === 'grid'); }
function fit(){
  if (!frameBox) return;
  var w = +frameBox.dataset.w, hh = +frameBox.dataset.h, pad = frameBox.classList.contains('phone') ? 20 : 2;
  var availH = stage.clientHeight - 48, availW = stage.clientWidth - 48;
  var s = Math.min(1, availH / (hh + pad), availW / (w + pad));
  frameBox.style.transform = 'scale(' + s + ')';
  frameBox.style.marginBottom = (-(1 - s) * (hh + pad)) + 'px';
}
function go(id, fromNav){
  var it = byId[id]; if (!it || !window.__TIKI_FILES[id]) return;
  if (cur && cur !== id && !fromNav) hist.push(cur);
  if (fromNav) hist = [];
  cur = id; backBtn.disabled = hist.length === 0;
  setView('phone'); mark(id); titleEl.textContent = it.title;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  stage.innerHTML = '';
  var isComp = it.group === 'components';
  var w = isComp ? it.w : 390, hh = isComp ? it.h : 844;
  var box = document.createElement('div'); box.className = isComp ? 'comp' : 'phone';
  box.dataset.w = w; box.dataset.h = hh;
  var f = document.createElement('iframe'); f.width = w; f.height = hh; f.title = it.title; f.srcdoc = docFor(id);
  box.appendChild(f); stage.appendChild(box); frameBox = box; fit();
}
window.tikiGo = function(id){ if (byId[id]) go(id, false); };
backBtn.onclick = function(){ if (!hist.length) return; var p = hist.pop(); var keep = hist.slice(); go(p, true); hist = keep; backBtn.disabled = hist.length === 0; };
document.getElementById('restart').onclick = function(){ if (cur) { var keep = hist.slice(); go(cur, true); hist = keep; backBtn.disabled = hist.length === 0; } };
document.getElementById('vPhone').onclick = function(){ go(cur || 'SignIn', true); };
document.getElementById('vGrid').onclick = function(){
  setView('grid'); mark(null); titleEl.textContent = 'All screens'; frameBox = null; stage.innerHTML = '';
  var g = document.createElement('div'); g.className = 'grid';
  NAV.attendee.concat(NAV.host, NAV.arabic).forEach(function(it){
    var t = document.createElement('button'); t.className = 'tile';
    var fr = document.createElement('div'); fr.className = 'frame';
    var f = document.createElement('iframe'); f.title = it.title; f.loading = 'lazy'; f.tabIndex = -1; f.srcdoc = docFor(it.id);
    fr.appendChild(f); t.appendChild(fr);
    var c = document.createElement('div'); c.className = 'cap'; c.textContent = it.title; t.appendChild(c);
    t.onclick = function(){ go(it.id, true); }; g.appendChild(t);
  });
  stage.appendChild(g);
};
function showNotes(){
  setView('none'); mark('__notes'); titleEl.textContent = 'Product & design notes'; frameBox = null; stage.innerHTML = '';
  var n = document.createElement('div'); n.className = 'notes';
  NOTES.forEach(function(t){ var d = document.createElement('div'); d.className = 'note'; d.textContent = t; n.appendChild(d); });
  stage.appendChild(n);
}
window.addEventListener('resize', fit);
window.addEventListener('hashchange', function(){ var id = (location.hash || '').slice(1); if (byId[id] && id !== cur) go(id, true); });
var start = (location.hash || '').slice(1);
go(byId[start] ? start : 'SignIn', true);
</script>
